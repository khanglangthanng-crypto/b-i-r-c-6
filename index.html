<style>
  :root { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden; font-family: sans-serif;
  }
  #stage {
    position: fixed; inset: 0; overflow: hidden; z-index: 1;
  }
  .pic {
    position: absolute;
    border-radius: 10px;
    box-shadow: 0 0 25px rgba(255,0,80,0.6);
    animation: pop 0.4s ease-out;
    will-change: transform;
  }
  @keyframes pop {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  #banner {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 14px env(safe-area-inset-right,10px) 10px env(safe-area-inset-left,10px);
    padding-top: calc(14px + env(safe-area-inset-top,0px));
    background: linear-gradient(180deg, rgba(0,0,0,.85), transparent);
    color: #fff; text-align: center; font-weight: bold; font-size: 15px;
    z-index: 10; pointer-events: none; letter-spacing: 0.5px;
  }
  #timer {
    position: fixed; bottom: calc(14px + env(safe-area-inset-bottom,0px)); right: 14px;
    color: #fff; background: rgba(0,0,0,0.6); padding: 6px 12px;
    border-radius: 20px; font-size: 13px; z-index: 10; pointer-events: none;
  }
  #done {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; background: #111; color: #fff; z-index: 20;
    text-align: center; padding: 20px;
  }
  #done img { max-width: 70vw; max-height: 40vh; border-radius: 12px; }
  #done button {
    padding: 10px 22px; border-radius: 8px; border: none; background: #e4568f;
    color: #fff; font-size: 15px; font-weight: bold;
  }
</style>

  const DURATION_MS = 120000; // 2 phút
  let spawning = true;
  let startTime = Date.now();

  function rand(min, max) { return Math.random() * (max - min) + min; }

  function spawnPic() {
    if (!spawning) return;
    const img = document.createElement('img');
    img.src = DATA_URI;
    img.className = 'pic';
    const size = rand(60, Math.min(window.innerWidth, window.innerHeight) * 0.35);
    img.style.width = size + 'px';
    img.style.height = 'auto';
    img.style.left = rand(0, Math.max(0, window.innerWidth - size)) + 'px';
    img.style.top = rand(0, Math.max(0, window.innerHeight - size)) + 'px';
    img.style.transform = 'rotate(' + rand(-25, 25) + 'deg)';
    stage.appendChild(img);

    // keep DOM light: cap number of pics
    const pics = stage.querySelectorAll('.pic');
    if (pics.length > 60) {
      pics[0].remove();
    }
  }

  const spawnInterval = setInterval(spawnPic, 160);

  // flashing background
  const colors = ['#000', '#1a0010', '#101010', '#200014'];
  let ci = 0;
  const flashInterval = setInterval(() => {
    document.body.style.background = colors[ci % colors.length];
    ci++;
  }, 500);

  // timer display
  const timerEl = document.getElementById('timer');
  const timerInterval = setInterval(() => {
    const left = Math.max(0, Math.ceil((DURATION_MS - (Date.now() - startTime)) / 1000));
    timerEl.textContent = left + 's';
  }, 1000);

  // chặn đóng tab bằng tổ hợp thông thường (beforeunload) trong thời gian troll
  function beforeUnloadHandler(e) {
    if (spawning) {
      e.preventDefault();
      e.returnValue = '';
      return '';
    }
  }
  window.addEventListener('beforeunload', beforeUnloadHandler);

  // tự tắt sau 2 phút
  setTimeout(() => {
    spawning = false;
    clearInterval(spawnInterval);
    clearInterval(flashInterval);
    clearInterval(timerInterval);
    window.removeEventListener('beforeunload', beforeUnloadHandler);
    stage.innerHTML = '';
    document.getElementById('banner').style.display = 'none';
    document.getElementById('timer').style.display = 'none';
    document.body.style.background = '#111';
    document.getElementById('done').style.display = 'flex';
  }, DURATION_MS);
</script>
